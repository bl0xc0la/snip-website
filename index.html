<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>snip</title>
  <style>
    :root{
      --bg:#0b0b0d;--panel:#121216;--panel2:#17171c;--line:#27272e;
      --text:#f5f5f7;--muted:#9b9ba5;--accent:#fff;--danger:#ff5c7a;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    .app{min-height:100vh}
    .topbar{
      position:sticky;top:0;z-index:30;height:64px;border-bottom:1px solid var(--line);
      background:rgba(11,11,13,.94);backdrop-filter:blur(14px);display:flex;align-items:center;
      padding:0 22px;gap:18px
    }
    .brand{font-size:25px;font-weight:850;letter-spacing:-1.2px}
    .search{
      flex:1;max-width:520px;margin:auto;display:flex;align-items:center;background:var(--panel);
      border:1px solid var(--line);border-radius:14px;padding:0 14px
    }
    .search input{width:100%;height:42px;background:transparent;border:0;outline:0;color:var(--text)}
    .nav-actions{display:flex;gap:8px}
    .btn{
      border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;
      border-radius:12px;font-weight:700
    }
    .btn:hover{background:var(--panel2)}
    .btn.primary{background:var(--text);color:#050507;border-color:var(--text)}
    .layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,680px) 280px;gap:24px;padding:24px}
    .side,.right{position:sticky;top:88px;height:max-content}
    .side-card,.right-card,.modal-card,.composer,.profile-card{background:var(--panel);border:1px solid var(--line);border-radius:18px}
    .side-card{padding:10px}
    .side-item{display:block;padding:12px;border-radius:12px;color:#ddd}
    .side-item:hover,.side-item.active{background:var(--panel2);color:#fff}
    .right-card{padding:16px}
    .muted{color:var(--muted)}
    .feed{display:flex;flex-direction:column;gap:18px}
    .composer{padding:14px;display:flex;gap:12px;align-items:center}
    .mini-avatar,.avatar{border-radius:50%;background:#26262d;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
    .mini-avatar{width:42px;height:42px}
    .avatar{width:76px;height:76px;border:3px solid var(--panel)}
    .mini-avatar img,.avatar img{width:100%;height:100%;object-fit:cover}
    .composer input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px 13px;color:var(--text);outline:0}
    .video-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
    .video-wrap{background:#000;display:flex;justify-content:center}
    .video-wrap video{display:block;width:100%;max-height:760px;object-fit:contain;background:#000}
    .video-meta{padding:15px}
    .user-row{display:flex;align-items:center;gap:11px}
    .user-copy{min-width:0}
    .username{font-weight:800}
    .title{margin:9px 0 6px;font-size:17px;font-weight:750}
    .hashtags{display:flex;flex-wrap:wrap;gap:6px}
    .tag{color:#c8c8ff;font-size:13px}
    .video-actions{display:flex;gap:8px;margin-top:14px}
    .action{border:1px solid var(--line);background:var(--panel2);color:#ddd;border-radius:10px;padding:8px 11px}
    .action:hover{background:#1e1e24}
    .profile-page{display:none}
    .profile-banner{height:210px;border-radius:18px 18px 0 0;background:#1a1a20 center/cover no-repeat}
    .profile-head{padding:0 20px 20px;position:relative;background:var(--panel);border-radius:0 0 18px 18px;border:1px solid var(--line);border-top:0}
    .profile-top{display:flex;gap:15px;align-items:end;margin-top:-38px}
    .profile-info{padding-top:42px}
    .profile-info h1{margin:0;font-size:25px}
    .profile-info p{margin:4px 0 0}
    .profile-tools{margin-left:auto;display:flex;gap:8px}
    .profile-about{padding-top:14px}
    .section-title{font-size:18px;font-weight:800;margin:18px 0 10px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .grid .video-card video{aspect-ratio:9/16;object-fit:cover}
    .empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
    .overlay.show{display:flex}
    .modal-card{width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .modal-head h2{margin:0;font-size:20px}
    .x{border:0;background:transparent;color:#aaa;font-size:24px}
    .form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:13px;color:#bbb}
    .field input,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px;outline:0}
    .field textarea{min-height:100px;resize:vertical}
    .comments{display:flex;flex-direction:column;gap:12px;margin-top:14px}
    .comment{display:flex;gap:10px}
    .comment-body{background:var(--panel2);border-radius:13px;padding:10px 12px;flex:1}
    .comment-user{font-weight:800;font-size:13px}
    .comment-text{margin-top:4px;white-space:pre-wrap;word-break:break-word}
    .comment-gif{display:block;max-width:240px;max-height:240px;border-radius:10px;margin-top:8px}
    .notice{margin-top:10px;font-size:13px;color:#ffb3c2;display:none}
    .stats{display:flex;gap:14px;margin-top:12px;font-size:14px}
    .clickable{cursor:pointer}
    .hidden{display:none!important}
    @media(max-width:1020px){
      .layout{grid-template-columns:1fr;max-width:760px}
      .side,.right{display:none}
    }
    @media(max-width:640px){
      .topbar{padding:0 12px;gap:10px}.search{display:none}.nav-actions .btn{padding:8px 10px}
      .layout{padding:12px}.grid{grid-template-columns:1fr}.profile-banner{height:150px}
      .profile-top{align-items:start}.profile-tools{margin-left:0}.profile-info{padding-top:8px}
      .profile-top{flex-direction:column}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="brand btn" id="homeBtn" style="border:0;background:transparent;padding:0">snip</button>
    <div class="search">
      <input id="searchInput" placeholder="search snip">
    </div>
    <div class="nav-actions">
      <button class="btn" id="authBtn">log in</button>
      <button class="btn primary" id="uploadBtn">upload</button>
    </div>
  </header>

  <main class="layout">
    <aside class="side">
      <div class="side-card">
        <a href="#" class="side-item active" id="feedLink">for you</a>
        <a href="#" class="side-item" id="profileLink">my profile</a>
      </div>
    </aside>

    <section>
      <div id="feedView" class="feed"></div>
      <div id="profileView" class="profile-page"></div>
    </section>

    <aside class="right">
      <div class="right-card">
        <strong>snip</strong>
        <p class="muted">short videos without the extra noise.</p>
        <p class="muted" style="font-size:13px">accounts, uploads, profiles, comments and hashtags are all handled by the api.</p>
      </div>
    </aside>
  </main>
</div>

<div class="overlay" id="modal">
  <div class="modal-card" id="modalContent"></div>
</div>

<script>
  // frontend lives on github pages. point this at your node backend.
  // suggested api hostname: https://api.snip.env.pm
  const API_BASE = window.SNIP_API_BASE || "https://api.snip.env.pm";

  const state = {
    me: null,
    videos: [],
    activeProfile: null,
    search: ""
  };

  const $ = (id) => document.getElementById(id);
  const esc = (value="") => String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));

  function mediaUrl(path) {
    if (!path) return "";
    if (/^https?:\/\//i.test(path)) return path;
    return API_BASE.replace(/\/$/, "") + path;
  }

  async function api(path, options={}) {
    const res = await fetch(API_BASE.replace(/\/$/,"") + path, {
      credentials: "include",
      ...options
    });
    const type = res.headers.get("content-type") || "";
    const data = type.includes("application/json") ? await res.json() : await res.text();
    if (!res.ok) throw new Error(data?.error || data || "request failed");
    return data;
  }

  function openModal(html) {
    $("modalContent").innerHTML = html;
    $("modal").classList.add("show");
  }
  function closeModal() {
    $("modal").classList.remove("show");
    $("modalContent").innerHTML = "";
  }
  $("modal").addEventListener("click", e => {
    if (e.target === $("modal")) closeModal();
  });

  function avatarHtml(user, large=false) {
    const cls = large ? "avatar" : "mini-avatar";
    const content = user.pfp ? `<img src="${mediaUrl(user.pfp)}" alt="">` : esc((user.username||"?")[0].toUpperCase());
    return `<div class="${cls}">${content}</div>`;
  }

  function videoCard(v) {
    const hashtags = (v.hashtags || []).map(t => `<span class="tag">#${esc(t)}</span>`).join(" ");
    return `
      <article class="video-card" data-video="${esc(v.id)}">
        <div class="video-wrap">
          <video controls playsinline preload="metadata" src="${mediaUrl(v.video)}"></video>
        </div>
        <div class="video-meta">
          <div class="user-row">
            <div class="clickable" data-profile="${esc(v.username)}">${avatarHtml(v.user)}</div>
            <div class="user-copy">
              <div class="username clickable" data-profile="${esc(v.username)}">@${esc(v.username)}</div>
              <div class="muted" style="font-size:12px">${new Date(v.createdAt).toLocaleString()}</div>
            </div>
          </div>
          <div class="title">${esc(v.title)}</div>
          <div class="hashtags">${hashtags}</div>
          <div class="video-actions">
            <button class="action comment-btn" data-video="${esc(v.id)}">comments</button>
            <button class="action" data-copy="${esc(v.id)}">copy link</button>
          </div>
        </div>
      </article>
    `;
  }

  async function loadMe() {
    try {
      const data = await api("/api/auth/me");
      state.me = data.user;
    } catch {
      state.me = null;
    }
    $("authBtn").textContent = state.me ? "@" + state.me.username : "log in";
  }

  async function loadFeed() {
    $("feedView").innerHTML = `<div class="empty">loading...</div>`;
    try {
      const q = state.search ? `?q=${encodeURIComponent(state.search)}` : "";
      const data = await api("/api/videos" + q);
      state.videos = data.videos;
      renderFeed();
    } catch (err) {
      $("feedView").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
    }
  }

  function renderFeed() {
    let cards = state.videos;
    if (!cards.length) {
      $("feedView").innerHTML = `<div class="empty">nothing here yet</div>`;
      return;
    }
    $("feedView").innerHTML =
      (state.me ? `
        <div class="composer">
          ${avatarHtml(state.me)}
          <input id="composerInput" placeholder="what are you snipping?">
        </div>` : "") +
      cards.map(videoCard).join("");
  }

  async function loadProfile(username) {
    $("feedView").style.display = "none";
    $("profileView").style.display = "block";
    $("profileView").innerHTML = `<div class="empty">loading profile...</div>`;
    try {
      const data = await api("/api/users/" + encodeURIComponent(username));
      state.activeProfile = data.user;
      renderProfile(data.user);
    } catch (err) {
      $("profileView").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
    }
  }

  function renderProfile(u) {
    const banner = u.banner ? mediaUrl(u.banner) : "";
    const vids = (u.videos || []).map(videoCard).join("");
    $("profileView").innerHTML = `
      <div class="profile-card">
        <div class="profile-banner" style="${banner ? `background-image:url('${banner}')` : ""}"></div>
        <div class="profile-head">
          <div class="profile-top">
            ${avatarHtml(u,true)}
            <div class="profile-info">
              <h1>${esc(u.username)}</h1>
              <p class="muted">${esc(u.bio || "no bio yet")}</p>
              <div class="stats">
                <span>${u.videos?.length || 0} videos</span>
                <span>joined ${new Date(u.createdAt).toLocaleDateString()}</span>
              </div>
            </div>
            ${state.me?.username === u.username ? `<div class="profile-tools"><button class="btn" id="editProfileBtn">edit profile</button></div>` : ""}
          </div>
        </div>
      </div>
      <div class="section-title">videos</div>
      ${vids ? `<div class="grid">${vids}</div>` : `<div class="empty">no videos yet</div>`}
    `;
    $("editProfileBtn")?.addEventListener("click", showEditProfile);
  }

  function showAuth(mode="login") {
    openModal(`
      <div class="modal-head"><h2>${mode === "login" ? "log in" : "create account"}</h2><button class="x" id="close">×</button></div>
      <form class="form" id="authForm">
        <div class="field"><label>username</label><input name="username" maxlength="24" required pattern="[A-Za-z0-9_]{3,24}"></div>
        <div class="field"><label>password</label><input type="password" name="password" minlength="8" required></div>
        <button class="btn primary" type="submit">${mode === "login" ? "log in" : "create account"}</button>
        <button class="btn" type="button" id="switchAuth">${mode === "login" ? "need an account" : "already have an account"}</button>
        <div class="notice" id="formNotice"></div>
      </form>
    `);
    $("close").onclick = closeModal;
    $("switchAuth").onclick = () => showAuth(mode === "login" ? "register" : "login");
    $("authForm").onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = Object.fromEntries(fd.entries());
      try {
        const endpoint = mode === "login" ? "/api/auth/login" : "/api/auth/register";
        const data = await api(endpoint, {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(payload)
        });
        state.me = data.user;
        $("authBtn").textContent = "@" + state.me.username;
        closeModal();
        await loadFeed();
      } catch(err) {
        $("formNotice").textContent = err.message;
        $("formNotice").style.display = "block";
      }
    };
  }

  function showUpload() {
    if (!state.me) return showAuth("login");
    openModal(`
      <div class="modal-head"><h2>upload a snip</h2><button class="x" id="close">×</button></div>
      <form class="form" id="uploadForm">
        <div class="field"><label>video file</label><input type="file" name="video" accept="video/*" required></div>
        <div class="field"><label>title</label><input name="title" maxlength="120" required placeholder="give it a title"></div>
        <div class="field"><label>hashtags</label><input name="hashtags" maxlength="300" placeholder="#funny #music #whatever"></div>
        <button class="btn primary" type="submit">upload</button>
        <div class="notice" id="formNotice"></div>
      </form>
    `);
    $("close").onclick = closeModal;
    $("uploadForm").onsubmit = async e => {
      e.preventDefault();
      const form = new FormData(e.target);
      try {
        await api("/api/videos", {method:"POST",body:form});
        closeModal();
        await loadFeed();
      } catch(err) {
        $("formNotice").textContent = err.message;
        $("formNotice").style.display = "block";
      }
    };
  }

  function showEditProfile() {
    const u = state.me;
    openModal(`
      <div class="modal-head"><h2>edit profile</h2><button class="x" id="close">×</button></div>
      <form class="form" id="profileForm">
        <div class="field"><label>bio</label><textarea name="bio" maxlength="180">${esc(u.bio || "")}</textarea></div>
        <div class="field"><label>profile picture</label><input type="file" name="pfp" accept="image/*"></div>
        <div class="field"><label>profile banner</label><input type="file" name="banner" accept="image/*"></div>
        <button class="btn primary" type="submit">save</button>
        <div class="notice" id="formNotice"></div>
      </form>
    `);
    $("close").onclick = closeModal;
    $("profileForm").onsubmit = async e => {
      e.preventDefault();
      try {
        const data = await api("/api/profile", {method:"POST",body:new FormData(e.target)});
        state.me = data.user;
        closeModal();
        await loadProfile(state.me.username);
        $("authBtn").textContent = "@" + state.me.username;
      } catch(err) {
        $("formNotice").textContent = err.message;
        $("formNotice").style.display = "block";
      }
    };
  }

  async function showComments(videoId) {
    try {
      const data = await api("/api/videos/" + encodeURIComponent(videoId) + "/comments");
      const comments = data.comments || [];
      openModal(`
        <div class="modal-head"><h2>comments</h2><button class="x" id="close">×</button></div>
        <div class="comments">
          ${comments.length ? comments.map(c => `
            <div class="comment">
              ${avatarHtml(c.user)}
              <div class="comment-body">
                <div class="comment-user">@${esc(c.user.username)}</div>
                ${c.text ? `<div class="comment-text">${esc(c.text)}</div>` : ""}
                ${c.gif ? `<img class="comment-gif" src="${mediaUrl(c.gif)}" alt="gif">` : ""}
              </div>
            </div>`).join("") : `<div class="empty">no comments yet</div>`}
        </div>
        ${state.me ? `
          <form class="form" id="commentForm">
            <div class="field"><label>comment</label><textarea name="text" maxlength="500" placeholder="say something"></textarea></div>
            <div class="field"><label>gif (optional)</label><input type="file" name="gif" accept="image/gif"></div>
            <button class="btn primary" type="submit">post comment</button>
            <div class="notice" id="formNotice"></div>
          </form>` : `<p class="muted" style="margin-top:16px">log in to comment</p>`}
      `);
      $("close").onclick = closeModal;
      $("commentForm")?.addEventListener("submit", async e => {
        e.preventDefault();
        try {
          await api("/api/videos/" + encodeURIComponent(videoId) + "/comments", {method:"POST",body:new FormData(e.target)});
          await showComments(videoId);
        } catch(err) {
          $("formNotice").textContent = err.message;
          $("formNotice").style.display = "block";
        }
      });
    } catch(err) {
      openModal(`<div class="modal-head"><h2>comments</h2><button class="x" id="close">×</button></div><div class="empty">${esc(err.message)}</div>`);
      $("close").onclick = closeModal;
    }
  }

  document.addEventListener("click", async e => {
    const profile = e.target.closest("[data-profile]");
    if (profile) {
      e.preventDefault();
      await loadProfile(profile.dataset.profile);
      return;
    }
    const comment = e.target.closest(".comment-btn");
    if (comment) {
      await showComments(comment.dataset.video);
      return;
    }
    const copy = e.target.closest("[data-copy]");
    if (copy) {
      const url = location.origin + location.pathname + "#video=" + encodeURIComponent(copy.dataset.copy);
      await navigator.clipboard?.writeText(url);
      copy.textContent = "copied";
      setTimeout(() => copy.textContent = "copy link", 1000);
    }
  });

  $("homeBtn").onclick = async () => {
    $("profileView").style.display = "none";
    $("feedView").style.display = "flex";
    await loadFeed();
  };
  $("feedLink").onclick = async e => { e.preventDefault(); $("homeBtn").click(); };
  $("profileLink").onclick = async e => {
    e.preventDefault();
    if (!state.me) return showAuth("login");
    await loadProfile(state.me.username);
  };
  $("uploadBtn").onclick = showUpload;
  $("authBtn").onclick = async () => {
    if (!state.me) return showAuth("login");
    openModal(`
      <div class="modal-head"><h2>@${esc(state.me.username)}</h2><button class="x" id="close">×</button></div>
      <div class="form">
        <button class="btn" id="goProfile">my profile</button>
        <button class="btn" id="logout">log out</button>
      </div>
    `);
    $("close").onclick = closeModal;
    $("goProfile").onclick = async () => { closeModal(); await loadProfile(state.me.username); };
    $("logout").onclick = async () => {
      await api("/api/auth/logout",{method:"POST"});
      state.me = null;
      $("authBtn").textContent = "log in";
      closeModal();
      await loadFeed();
    };
  };

  let searchTimer;
  $("searchInput").addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
      state.search = $("searchInput").value.trim();
      await loadFeed();
    }, 250);
  });

  loadMe().then(loadFeed);
</script>
</body>
</html>
